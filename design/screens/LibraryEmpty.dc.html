        <p style="margin: 0; font-size: 16.5px; line-height: 1.5; color: {{t.muted}};">Sign in to save articles into folders. Your library is the same on every device you sign in to.</p>

<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false,"section":"Theme"},"type":{"editor":"enum","options":["serif","sans"],"default":"serif","section":"Theme"},"guest":{"editor":"boolean","default":false,"section":"State"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  theme(dark, type) {
    const serif = "'Baskervville', Baskerville, 'Libre Baskerville', Georgia, serif";
    const sans = "'Inter', system-ui, sans-serif";
    const base = dark
      ? { bg: '#1E1C19', surface: '#262320', ink: '#C9C0B0', muted: '#8E8678', rule: '#38332D', accent: '#C8705F' }
      : { bg: '#F1EBE0', surface: '#F8F3EA', ink: '#1C1A17', muted: '#6B645A', rule: '#DDD4C4', accent: '#A8372A' };
    base.head = type === 'sans' ? sans : serif;
    base.body = type === 'sans' ? sans : serif;
    return base;
  }
  renderVals() {
    const guest = this.props.guest ?? false;
    return {
      t: this.theme(this.props.dark ?? false, this.props.type ?? 'serif'),
      guest: guest,
      signedIn: !guest,
      countLine: guest ? 'Not signed in' : '1 folder · 0 articles'
    };
  }
}
</script>
