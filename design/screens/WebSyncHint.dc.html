<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Un:edited — Library sync hint (first visit)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baskervville:ital,wght@0,400..700;1,400..700&amp;family=Inter:wght@400;500&amp;family=JetBrains+Mono:wght@400;500&amp;family=Tiro+Devanagari+Hindi&amp;family=Tiro+Devanagari+Marathi&amp;family=Mukta:wght@400;500&amp;display=swap">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
button{font:inherit}
*{scrollbar-width:thin;scrollbar-color:rgba(122,112,98,.45) transparent}
::-webkit-scrollbar{width:10px;height:10px;background:transparent}
::-webkit-scrollbar-track,::-webkit-scrollbar-corner{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(122,112,98,.4);border-radius:10px;border:3px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:rgba(122,112,98,.7);border:3px solid transparent;background-clip:padding-box}
/* Devanagari: Tiro (serif) by default, Mukta when the reader picks Sans (data-dv="sans") */
[lang="hi"],[lang="hi"] *,[lang="mr"],[lang="mr"] *{letter-spacing:0!important;text-transform:none!important}
[lang="hi"],[lang="hi"] *{font-family:'Tiro Devanagari Hindi','Mukta',serif!important;font-style:normal}
[lang="mr"],[lang="mr"] *{font-family:'Tiro Devanagari Marathi','Mukta',serif!important;font-style:normal}
[data-dv="sans"] [lang="hi"],[data-dv="sans"] [lang="hi"] *,[data-dv="sans"] [lang="mr"],[data-dv="sans"] [lang="mr"] *,[data-dv="sans"][lang="hi"],[data-dv="sans"][lang="mr"]{font-family:'Mukta',sans-serif!important}
</style>
</helmet>
<aside aria-label="About your library" style="width: 100%; box-sizing: border-box; display: flex; flex-direction: column; gap: 12px; background: {{t.surface}}; border: 1px solid {{t.rule}}; padding: 18px 20px; color: {{t.ink}}; font-family: 'Baskervville', Baskerville, 'Libre Baskerville', Georgia, serif;">
  <span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.8px; text-transform: uppercase; color: {{t.muted}};">On this browser</span>
  <p style="margin: 0; font-size: 17px; line-height: 1.5;">Your library is the same on every device you sign in to. Downloads stay on the device you download them on.</p>
  <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; font-family: 'Inter', sans-serif; font-size: 14px;">
    <a href="WebYou.dc.html" style="height: 44px; display: flex; align-items: center; text-decoration: underline; text-underline-offset: 3px;">Storage settings</a>
    <button onClick="{{onDismiss}}" style="height: 40px; padding: 0 16px; border: 1px solid {{t.ink}}; background: none; color: {{t.ink}}; font-weight: 500; cursor: pointer;">Got it</button>
  </div>
</aside>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"onDismiss":{"editor":null},"$preview":{"width":320,"height":200}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = this.props.dark ?? false;
    return {
      t: dark
        ? { surface: '#262320', ink: '#C9C0B0', muted: '#8E8678', rule: '#38332D' }
        : { surface: '#F8F3EA', ink: '#1C1A17', muted: '#6B645A', rule: '#DDD4C4' },
      onDismiss: this.props.onDismiss ?? (() => {})
    };
  }
}
</script>
</body>
</html>
