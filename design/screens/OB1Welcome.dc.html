<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Un:edited — Welcome</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
@keyframes ob-wipe{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 -4% 0 0)}}
@keyframes ob-rule{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes ob-rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.ob-wipe{animation:ob-wipe 1.1s cubic-bezier(.65,0,.35,1) .25s both}
.ob-rule{transform-origin:50% 50%;animation:ob-rule .7s cubic-bezier(.65,0,.35,1) 1.25s both}
.ob-rise{animation:ob-rise .6s cubic-bezier(.2,.7,.2,1) both}
.ob-d1{animation-delay:1.6s}
.ob-d2{animation-delay:2.3s}
.ob-d3{animation-delay:2.8s}
.ob-d4{animation-delay:3.3s}
.ob-d5{animation-delay:3.9s}
@media (prefers-reduced-motion: reduce){.ob-wipe,.ob-rule,.ob-rise{animation:none}}
*{scrollbar-width:none}*::-webkit-scrollbar{display:none}
/* Devanagari: Tiro (serif) by default, Mukta when the reader picks Sans (data-dv="sans") */
[lang="hi"],[lang="hi"] *,[lang="mr"],[lang="mr"] *{letter-spacing:0!important;text-transform:none!important}
[lang="hi"],[lang="hi"] *{font-family:'Tiro Devanagari Hindi','Mukta',serif!important;font-style:normal}
[lang="mr"],[lang="mr"] *{font-family:'Tiro Devanagari Marathi','Mukta',serif!important;font-style:normal}
[data-dv="sans"] [lang="hi"],[data-dv="sans"] [lang="hi"] *,[data-dv="sans"] [lang="mr"],[data-dv="sans"] [lang="mr"] *,[data-dv="sans"][lang="hi"],[data-dv="sans"][lang="mr"]{font-family:'Mukta',sans-serif!important}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 0 32px 32px 32px; background: {{t.bg}}; color: {{t.ink}}; font-family: 'Baskervville', Baskerville, 'Libre Baskerville', Georgia, serif; display: flex; flex-direction: column; align-items: center; text-align: center;">

  <div style="flex: 1; width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0;">
    <div data-dc-group="" style="box-sizing: border-box; display: flex; flex-direction: column; gap: 0px; justify-content: center; align-items: center"><h1 class="ob-wipe" aria-label="Un:edited" style="margin: 0; font-weight: 700; font-size: 56px; letter-spacing: -1.2px; line-height: 1; display: flex; align-items: center;"><span style="color: {{t.accent}};">Un</span><span aria-hidden="true" style="display: inline-flex; flex-direction: column; gap: 10px; margin: 0 4px; padding-top: 6px;"><span style="width: 9px; height: 9px; border-radius: 50%; background: {{t.accent}};"></span><span style="width: 9px; height: 9px; border-radius: 50%; background: {{t.accent}};"></span></span>edited</h1><p class="ob-rise ob-d1" style="margin: 20px 0 0 0; font-style: italic; font-size: 22px; line-height: 1.35;">Every story, as it was written.</p></div>
    
    

    <span class="ob-rule" aria-hidden="true" style="margin-top: 22px; width: 224px; height: 2px; background: {{t.accent}}"></span><ul style="margin: 44px 0 0 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 14px; font-family: 'Inter', sans-serif; font-size: 15px; line-height: 1.45; color: {{t.muted}};">
      <li class="ob-rise ob-d2"><b style="color: {{t.ink}}; font-weight: 500;">No AI.</b> Every word comes from the publisher.</li>
      <li class="ob-rise ob-d3"><b style="color: {{t.ink}}; font-weight: 500;">No algorithm.</b> Only the outlets you choose.</li>
      <li class="ob-rise ob-d4"><b style="color: {{t.ink}}; font-weight: 500;">No fee.</b> Free for everyone, always.</li>
    </ul>
  </div>

  <div class="ob-rise ob-d5" style="width: 100%; display: flex; flex-direction: column; gap: 8px;">
    <a href="OB2Language.dc.html" style="height: 52px; background: {{t.ink}}; color: {{t.bg}}; display: flex; align-items: center; justify-content: center; font-family: 'Inter', sans-serif; font-size: 16px; font-weight: 500;">Set up my edition</a>
    <a href="OB9SignIn.dc.html" style="height: 44px; display: flex; align-items: center; justify-content: center; font-family: 'Inter', sans-serif; font-size: 14px; color: {{t.muted}};">I already have an account</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = this.props.dark ?? false;
    return {
      t: dark
        ? { bg: '#1E1C19', ink: '#C9C0B0', muted: '#8E8678', rule: '#38332D', accent: '#C8705F' }
        : { bg: '#F1EBE0', ink: '#1C1A17', muted: '#6B645A', rule: '#DDD4C4', accent: '#A8372A' }

  }
}
