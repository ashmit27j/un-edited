<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Un:edited — Empty folder</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
button{font:inherit}
*{scrollbar-width:none}*::-webkit-scrollbar{display:none}
/* Devanagari: Tiro (serif) by default, Mukta when the reader picks Sans (data-dv="sans") */
[lang="hi"],[lang="hi"] *,[lang="mr"],[lang="mr"] *{letter-spacing:0!important;text-transform:none!important}
[lang="hi"],[lang="hi"] *{font-family:'Tiro Devanagari Hindi','Mukta',serif!important;font-style:normal}
[lang="mr"],[lang="mr"] *{font-family:'Tiro Devanagari Marathi','Mukta',serif!important;font-style:normal}
[data-dv="sans"] [lang="hi"],[data-dv="sans"] [lang="hi"] *,[data-dv="sans"] [lang="mr"],[data-dv="sans"] [lang="mr"] *,[data-dv="sans"][lang="hi"],[data-dv="sans"][lang="mr"]{font-family:'Mukta',sans-serif!important}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: {{t.bg}}; color: {{t.ink}}; font-family: {{t.body}};">

  <header style="padding: 12px 24px 0 24px; display: flex; flex-direction: column; gap: 6px;">
    <div style="height: 44px; display: flex; align-items: center; justify-content: space-between;">
      <a href="LibraryEmpty.dc.html" style="height: 44px; margin-left: -6px; display: flex; align-items: center; gap: 4px; font-family: 'Inter', sans-serif; font-size: 15px;">
        <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round;"><path d="M15 5l-7 7 7 7"></path></svg>Library</a>
      <button aria-label="Folder options" style="width: 44px; height: 44px; margin-right: -10px; background: none; border: 0; color: {{t.ink}}; display: flex; align-items: center; justify-content: center; cursor: pointer;"><svg width="19" height="19" viewBox="0 0 24 24" aria-hidden="true" style="fill: currentColor;"><circle cx="5" cy="12" r="1.5"></circle><circle cx="12" cy="12" r="1.5"></circle><circle cx="19" cy="12" r="1.5"></circle></svg></button>
    </div>
    <h1 style="margin: 4px 0 0 0; font-family: {{t.head}}; font-weight: 500; font-size: 34px; letter-spacing: -0.5px;">Saved</h1>
    <div style="border-bottom: 1px solid {{t.ink}}; display: flex; align-items: center; justify-content: space-between; gap: 12px; font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.8px; text-transform: uppercase;">
      <span aria-live="polite" style="color: {{t.muted}};">0 articles · {{dl.status}}</span>
      <button onClick="{{dl.toggle}}" aria-label="{{dl.label}}" aria-pressed="{{dl.on}}" style="height: 36px; margin-right: -8px; padding: 0 8px; border: 0; background: none; color: {{dl.fg}}; display: flex; align-items: center; gap: 6px; font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.8px; text-transform: uppercase; cursor: pointer;">
        <sc-if value="{{dl.on}}" hint-placeholder-val="{{ false }}">
          <svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;"><path d="M4 7h16M9.5 7V4.5h5V7M6.5 7l1 13h9l1-13M10 11v5.5M14 11v5.5"></path></svg>
        </sc-if>
        <sc-if value="{{dl.off}}" hint-placeholder-val="{{ true }}">
          <svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;"><path d="M12 4v11M7.5 10.5L12 15l4.5-4.5M5 19.5h14"></path></svg>
        </sc-if>
        <span>{{dl.text}}</span>
      </button>
    </div>
  </header>

  <main style="position: absolute; left: 24px; right: 24px; top: 150px; bottom: 76px; display: flex; flex-direction: column; justify-content: center; gap: 28px;">
    <section style="display: flex; flex-direction: column; align-items: center; text-align: center; gap: 12px;">
      <svg width="44" height="44" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: {{t.muted}}; stroke-width: 1.2; stroke-linejoin: round;"><path d="M6 3.5h12v17l-6-4-6 4z"></path></svg>
      <h2 style="margin: 0; font-family: {{t.head}}; font-weight: 400; font-size: 26px; line-height: 1.15;">Nothing saved yet.</h2>
      <p style="margin: 0; font-size: 16.5px; line-height: 1.5; color: {{t.muted}};">Save a story to this folder and it lands here. Saving does not download. Tap Download to keep the whole folder for reading offline.</p>
    </section>
    <a href="Main.dc.html" style="height: 52px; background: {{t.ink}}; color: {{t.bg}}; display: flex; align-items: center; justify-content: center; font-family: 'Inter', sans-serif; font-size: 16px; font-weight: 500;">Go to today’s edition</a>
  </main>

  <nav aria-label="Main" style="position: absolute; left: 0; right: 0; bottom: 0; height: 76px; box-sizing: border-box; padding: 6px 12px 18px 12px; background: {{t.bg}}; border-top: 1px solid {{t.rule}}; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); font-family: 'Inter', sans-serif; font-size: 11px;">
    <a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: {{t.muted}};"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linejoin: round;"><path d="M4 5h16v14H4z"></path><path d="M4 9h16M9 9v10"></path></svg>Home</a>
    <a href="Feed.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: {{t.muted}};"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linejoin: round;"><path d="M6 3h12v18H6z"></path><path d="M9 8h6M9 12h6M9 16h3"></path></svg>Feed</a>
    <a href="LibraryEmpty.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: {{t.accent}}; font-weight: 500;"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linejoin: round;"><path d="M3.5 7h6l2 2h9v10h-17z"></path></svg>Library</a>
    <a href="You.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: {{t.muted}};"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round;"><circle cx="12" cy="8.5" r="3.5"></circle><path d="M5 20c1.2-3.6 4-5.5 7-5.5s5.8 1.9 7 5.5"></path></svg>You</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false,"section":"Theme"},"downloaded":{"editor":"boolean","default":false,"section":"State"},"type":{"editor":"enum","options":["serif","sans"],"default":"serif","section":"Theme"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { downloaded: null };
  }
  renderVals() {
    const dark = this.props.dark ?? false;
    const type = this.props.type ?? 'serif';
    const serif = "'Baskervville', Baskerville, 'Libre Baskerville', Georgia, serif";
    const sans = "'Inter', system-ui, sans-serif";
    const t = dark
      ? { bg: '#1E1C19', surface: '#262320', ink: '#C9C0B0', muted: '#8E8678', rule: '#38332D', accent: '#C8705F', accentSoft: '#3A2924' }
      : { bg: '#F1EBE0', surface: '#F8F3EA', ink: '#1C1A17', muted: '#6B645A', rule: '#DDD4C4', accent: '#A8372A', accentSoft: '#EBD5CC' };
    t.head = type === 'sans' ? sans : serif;
    t.body = type === 'sans' ? sans : serif;
    const on = this.state.downloaded === null ? (this.props.downloaded ?? false) : this.state.downloaded;
    const dl = on
      ? { on: true, off: false, label: 'Remove downloads from this folder', status: 'downloaded', text: 'Remove', fg: t.ink, edge: t.ink }
      : { on: false, off: true, label: 'Download all articles in this folder', status: 'online only', text: 'Download', fg: t.accent, edge: t.ink };
    dl.toggle = () => this.setState({ downloaded: !on });
    return { t: t, dl: dl };
  }
}
</script>
</body>
</html>
