<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Un:edited — Guest sign-in prompt</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baskervville:ital,wght@0,400..700;1,400..700&amp;family=Inter:wght@400;500&amp;family=JetBrains+Mono:wght@400;500&amp;family=Tiro+Devanagari+Hindi&amp;family=Tiro+Devanagari+Marathi&amp;family=Mukta:wght@400;500&amp;display=swap">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
*{scrollbar-width:none}*::-webkit-scrollbar{display:none}
/* Devanagari: Tiro (serif) by default, Mukta when the reader picks Sans (data-dv="sans") */
[lang="hi"],[lang="hi"] *,[lang="mr"],[lang="mr"] *{letter-spacing:0!important;text-transform:none!important}
[lang="hi"],[lang="hi"] *{font-family:'Tiro Devanagari Hindi','Mukta',serif!important;font-style:normal}
[lang="mr"],[lang="mr"] *{font-family:'Tiro Devanagari Marathi','Mukta',serif!important;font-style:normal}
[data-dv="sans"] [lang="hi"],[data-dv="sans"] [lang="hi"] *,[data-dv="sans"] [lang="mr"],[data-dv="sans"] [lang="mr"] *,[data-dv="sans"][lang="hi"],[data-dv="sans"][lang="mr"]{font-family:'Mukta',sans-serif!important}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden;">
  <dc-import name="Feed" dark="{{dark}}" hint-size="390px,844px"></dc-import>
  <div role="status" style="position: absolute; left: 16px; right: 16px; bottom: 92px; padding: 12px 12px 12px 16px; background: {{t.toast}}; color: {{t.toastInk}}; display: flex; align-items: center; gap: 12px;">
    <span style="flex: 1; font-family: 'Inter', sans-serif; font-size: 14px; line-height: 1.4;">Sign in to save articles to folders.</span>
    <a href="OB9SignIn.dc.html" style="height: 40px; padding: 0 14px; border: 1px solid {{t.toastInk}}; display: flex; align-items: center; font-family: 'Inter', sans-serif; font-size: 14px; font-weight: 500;">Sign in</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = this.props.dark ?? false;
    return {
      dark: dark,
      t: dark ? { toast: '#C9C0B0', toastInk: '#1E1C19' } : { toast: '#1C1A17', toastInk: '#F1EBE0' }
    };
  }
}
</script>
</body>
</html>
