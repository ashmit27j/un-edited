<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Un:edited — Topics</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baskervville:ital,wght@0,400..700;1,400..700&amp;family=Inter:wght@400;500&amp;family=JetBrains+Mono:wght@400;500&amp;family=Tiro+Devanagari+Hindi&amp;family=Tiro+Devanagari+Marathi&amp;family=Mukta:wght@400;500&amp;display=swap">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
button{font:inherit}
*{scrollbar-width:none}*::-webkit-scrollbar{display:none}
/* Devanagari: Tiro (serif) by default, Mukta when the reader picks Sans (data-dv="sans") */
[lang="hi"],[lang="hi"] *,[lang="mr"],[lang="mr"] *{letter-spacing:0!important;text-transform:none!important}
[lang="hi"],[lang="hi"] *{font-family:'Tiro Devanagari Hindi','Mukta',serif!important;font-style:normal}
[lang="mr"],[lang="mr"] *{font-family:'Tiro Devanagari Marathi','Mukta',serif!important;font-style:normal}
[data-dv="sans"] [lang="hi"],[data-dv="sans"] [lang="hi"] *,[data-dv="sans"] [lang="mr"],[data-dv="sans"] [lang="mr"] *,[data-dv="sans"][lang="hi"],[data-dv="sans"][lang="mr"]{font-family:'Mukta',sans-serif!important}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 12px 24px 28px 24px; background: {{t.bg}}; color: {{t.ink}}; font-family: 'Baskervville', Baskerville, 'Libre Baskerville', Georgia, serif; display: flex; flex-direction: column;">
  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); align-items: center; height: 44px;">
    <a href="OB3Reading.dc.html" aria-label="Back" style="width: 44px; height: 44px; margin-left: -12px; display: flex; align-items: center; justify-content: center;"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round;"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <span style="justify-self: center; font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.8px; text-transform: uppercase; color: {{t.muted}};">Step 3 of 6</span>
    <a href="OB8Printing.dc.html" style="justify-self: end; height: 44px; display: flex; align-items: center; font-family: 'Inter', sans-serif; font-size: 14px; color: {{t.muted}}; text-decoration: underline; text-underline-offset: 3px;">Skip</a>
  </div>
  <div style="height: 2px; background: {{t.rule}}; position: relative;"><span style="position: absolute; left: 0; top: 0; bottom: 0; width: 50%; background: {{t.accent}};"></span></div>

  <h1 style="margin: 24px 0 0 0; font-weight: 400; font-size: 30px; line-height: 1.15; letter-spacing: -0.4px;">What do you want to follow?</h1>
  <p style="margin: 10px 0 0 0; font-size: 17px; line-height: 1.45; color: {{t.muted}};">Each topic gets its own section on your front page.</p>

  <div style="margin-top: 22px; display: flex; flex-wrap: wrap; gap: 8px;">
    <sc-for list="{{topics}}" as="tp" hint-placeholder-count="18">
      <button aria-pressed="{{tp.on}}" onClick="{{tp.pick}}" style="height: 44px; padding: 0 16px; border: 1px solid {{tp.border}}; background: {{tp.fill}}; color: {{tp.color}}; font-family: 'Inter', sans-serif; font-size: 14px; cursor: pointer;">{{tp.label}}</button>
    </sc-for>
  </div>

  <div style="margin-top: auto; display: flex; flex-direction: column; gap: 10px;">
    <span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.8px; text-transform: uppercase; color: {{t.muted}}; text-align: center;">{{countLine}}</span>
    <sc-if value="{{ready}}" hint-placeholder-val="{{ true }}">
      <a href="OB5Regions.dc.html" style="height: 52px; background: {{t.ink}}; color: {{t.bg}}; display: flex; align-items: center; justify-content: center; font-family: 'Inter', sans-serif; font-size: 16px; font-weight: 500;">Continue</a>
    </sc-if>
    <sc-if value="{{notReady}}" hint-placeholder-val="{{ false }}">
      <button disabled="{{yes}}" style="height: 52px; border: 0; background: {{t.rule}}; color: {{t.muted}}; font-family: 'Inter', sans-serif; font-size: 16px; font-weight: 500; cursor: not-allowed;">Continue</button>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { on: { India: true, World: true, Technology: true, Science: true, Cities: true } };
  }
  renderVals() {
    const dark = this.props.dark ?? false;
    const t = dark
      ? { bg: '#1E1C19', ink: '#C9C0B0', muted: '#8E8678', rule: '#38332D', accent: '#C8705F' }
      : { bg: '#F1EBE0', ink: '#1C1A17', muted: '#6B645A', rule: '#DDD4C4', accent: '#A8372A' };
    const on = this.state.on;
    const names = ['India', 'World', 'Politics', 'Business', 'Finance', 'Technology', 'Science', 'Health', 'Environment', 'Climate', 'Education', 'Law & courts', 'Sport', 'Culture', 'Books', 'Cities', 'Agriculture', 'Research'];
    const topics = names.map((n) => ({
      label: n,
      on: !!on[n],
      border: on[n] ? t.ink : t.rule,
      fill: on[n] ? t.ink : 'transparent',
      color: on[n] ? t.bg : t.ink,
      pick: () => this.setState({ on: Object.assign({}, on, { [n]: !on[n] }) })
    }));
    const count = names.filter((n) => on[n]).length;
    return {
      t: t, topics: topics, yes: true,
      ready: count > 0, notReady: count === 0,
      countLine: count > 0 ? count + ' chosen' : 'Pick at least one topic'
    };
  }
}
</script>
</body>
</html>
