<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Un:edited — You</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baskervville:ital,wght@0,400..700;1,400..700&amp;family=Inter:wght@400;500&amp;family=JetBrains+Mono:wght@400;500&amp;family=Tiro+Devanagari+Hindi&amp;family=Tiro+Devanagari+Marathi&amp;family=Mukta:wght@400;500&amp;display=swap">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
button{font:inherit}
*{scrollbar-width:none}*::-webkit-scrollbar{display:none}
/* Devanagari: Tiro (serif) by default, Mukta when the reader picks Sans (data-dv="sans") */
[lang="hi"],[lang="hi"] *,[lang="mr"],[lang="mr"] *{letter-spacing:0!important;text-transform:none!important}
[lang="hi"],[lang="hi"] *{font-family:'Tiro Devanagari Hindi','Mukta',serif!important;font-style:normal}
[lang="mr"],[lang="mr"] *{font-family:'Tiro Devanagari Marathi','Mukta',serif!important;font-style:normal}
[data-dv="sans"] [lang="hi"],[data-dv="sans"] [lang="hi"] *,[data-dv="sans"] [lang="mr"],[data-dv="sans"] [lang="mr"] *,[data-dv="sans"][lang="hi"],[data-dv="sans"][lang="mr"]{font-family:'Mukta',sans-serif!important}
</style>
</helmet>
<div style="width: 390px; height: 2120px; box-sizing: border-box; position: relative; overflow: hidden; background: {{t.bg}}; color: {{t.ink}}; font-family: 'Inter', sans-serif;">
  <header style="padding: 22px 24px 0 24px;">
    <h1 style="margin: 0; font-family: 'Baskervville', Baskerville, 'Libre Baskerville', Georgia, serif; font-weight: 400; font-size: 34px; letter-spacing: -0.4px;">You</h1>
    <div style="margin-top: 14px; padding: 14px 0; border-top: 1px solid {{t.ink}}; border-bottom: 1px solid {{t.rule}}; display: flex; align-items: center; gap: 14px;">
      <span style="width: 44px; height: 44px; border-radius: 50%; background: {{t.accentSoft}}; color: {{t.accent}}; display: flex; align-items: center; justify-content: center; font-family: 'Baskervville', Baskerville, 'Libre Baskerville', Georgia, serif; font-weight: 700; font-size: 18px;">Y</span>
      <span style="flex: 1; display: flex; flex-direction: column; gap: 2px;">
        <span style="font-size: 15px; font-weight: 500;">[Your name]</span>
        <span style="font-size: 12.5px; color: {{t.muted}};">Signed in with Google · synced</span>
      </span>
    </div>
  </header>

  <main style="padding: 0 24px 110px 24px; display: flex; flex-direction: column;">
    <sc-for list="{{sections}}" as="sec" hint-placeholder-count="5">
      <section style="margin-top: 26px; display: flex; flex-direction: column;">
        <h2 style="margin: 0; padding-bottom: 8px; border-bottom: 1px solid {{t.ink}}; font-family: 'JetBrains Mono', monospace; font-weight: 500; font-size: 11px; letter-spacing: 1px; text-transform: uppercase;">{{sec.title}}</h2>
        <sc-for list="{{sec.rows}}" as="r" hint-placeholder-count="4">
          <div style="border-bottom: 1px solid {{t.rule}};">
            <sc-if value="{{r.isSwitch}}" hint-placeholder-val="{{ false }}">
              <button role="switch" aria-checked="{{r.on}}" onClick="{{r.pick}}" style="width: 100%; min-height: 52px; padding: 10px 0; display: flex; align-items: center; justify-content: space-between; gap: 14px; background: none; border: 0; color: {{t.ink}}; text-align: left; cursor: pointer;">
                <span style="display: flex; flex-direction: column; gap: 3px;">
                  <span style="font-size: 15px;">{{r.label}}</span>
                  <span style="font-size: 12.5px; line-height: 1.4; color: {{t.muted}};">{{r.desc}}</span>
                </span>
                <span style="width: 44px; height: 26px; flex-shrink: 0; box-sizing: border-box; border-radius: 13px; background: {{r.track}}; border: 1.5px solid {{r.edge}}; position: relative;">
                  <span style="position: absolute; top: 3px; left: {{r.knobX}}px; width: 17px; height: 17px; border-radius: 50%; background: {{r.knob}};"></span>
                </span>
              </button>
            </sc-if>
            <sc-if value="{{r.isAction}}" hint-placeholder-val="{{ false }}">
              <div style="padding: 6px 0; display: flex; flex-direction: column; gap: 10px;">
                <button onClick="{{r.ask}}" aria-expanded="{{r.asking}}" style="min-height: 52px; padding: 0; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 3px; background: none; border: 0; color: {{t.accent}}; text-align: left; cursor: pointer;">
                  <span style="font-size: 15px;">{{r.label}}</span>
                  <span style="font-size: 12.5px; line-height: 1.4; color: {{t.muted}};">{{r.desc}}</span>
                </button>
                <sc-if value="{{r.asking}}" hint-placeholder-val="{{ false }}">
                  <div role="alertdialog" aria-label="Clear all downloads" style="padding: 12px 14px; border: 1px solid {{t.ink}}; display: flex; flex-direction: column; gap: 12px;">
                    <span style="font-size: 14px; line-height: 1.45;">Remove the {{r.count}} downloaded articles from this phone? Your saved articles stay in your Library and can be downloaded again.</span>
                    <div style="display: flex; gap: 8px;">
                      <button onClick="{{r.confirm}}" style="flex: 1; height: 44px; border: 0; background: {{t.ink}}; color: {{t.bg}}; font-size: 14.5px; font-weight: 500; cursor: pointer;">Clear all downloads</button>
                      <button onClick="{{r.cancel}}" style="flex: 1; height: 44px; border: 1px solid {{t.ink}}; background: none; color: {{t.ink}}; font-size: 14.5px; font-weight: 500; cursor: pointer;">Cancel</button>
                    </div>
                  </div>
                </sc-if>
              </div>
            </sc-if>
            <sc-if value="{{r.isLink}}" hint-placeholder-val="{{ true }}">
              <a href="{{r.href}}" style="min-height: 52px; display: flex; align-items: center; justify-content: space-between; gap: 14px; color: {{r.color}};">
                <span style="font-size: 15px;">{{r.label}}</span>
                <span style="display: flex; align-items: center; gap: 8px; font-size: 14px; color: {{t.muted}};">{{r.value}}
                  <svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;"><path d="M9 5l7 7-7 7"></path></svg>
                </span>
              </a>
            </sc-if>
          </div>
        </sc-for>
      </section>
    </sc-for>
    <button style="margin-top: 28px; height: 48px; border: 1px solid {{t.rule}}; background: none; color: {{t.accent}}; font-size: 15px; cursor: pointer;">Sign out</button>
    <p style="margin: 16px 0 0 0; text-align: center; font-family: 'Baskervville', Baskerville, 'Libre Baskerville', Georgia, serif; font-style: italic; font-size: 14px; color: {{t.muted}};">Un:edited 1.0 · No AI, no algorithm, no fee.</p>
  </main>

  <nav aria-label="Main" style="position: absolute; left: 0; right: 0; bottom: 0; height: 76px; box-sizing: border-box; padding: 6px 12px 18px 12px; background: {{t.bg}}; border-top: 1px solid {{t.rule}}; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); font-size: 11px;">
    <a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: {{t.muted}};"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linejoin: round;"><path d="M4 5h16v14H4z"></path><path d="M4 9h16M9 9v10"></path></svg>Home</a>
    <a href="Feed.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: {{t.muted}};"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linejoin: round;"><path d="M6 3h12v18H6z"></path><path d="M9 8h6M9 12h6M9 16h3"></path></svg>Feed</a>
    <a href="Library.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: {{t.muted}};"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linejoin: round;"><path d="M3.5 7h6l2 2h9v10h-17z"></path></svg>Library</a>
    <a href="You.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: {{t.accent}}; font-weight: 500;"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round;"><circle cx="12" cy="8.5" r="3.5"></circle><path d="M5 20c1.2-3.6 4-5.5 7-5.5s5.8 1.9 7 5.5"></path></svg>You</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":2120}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    // autoDl: "Auto-download saved articles". Off by default: saving never downloads on its own.
    // Turning it off later keeps everything already downloaded; only "Clear all downloads" removes them.
    this.state = { trending: false, papers: true, outside: true, cont: true, autoDl: false, ask: false, cleared: false };
  }
  renderVals() {
    const dark = this.props.dark ?? false;
    const t = dark
      ? { bg: '#1E1C19', ink: '#C9C0B0', muted: '#8E8678', rule: '#38332D', accent: '#C8705F', accentSoft: '#3A2924' }
      : { bg: '#F1EBE0', ink: '#1C1A17', muted: '#6B645A', rule: '#DDD4C4', accent: '#A8372A', accentSoft: '#EBD5CC' };
    const s = this.state;
    const link = (label, value, href, color) => ({ isLink: true, isSwitch: false, isAction: false, label: label, value: value || '', href: href || '#', color: color || t.ink });
    const clearRow = () => ({
      isLink: false, isSwitch: false, isAction: true,
      label: s.cleared ? 'Downloads cleared' : 'Clear all downloads',
      desc: s.cleared ? 'Nothing is stored on this phone. Your saved articles are still in your Library.' : 'Removes every downloaded article from this phone.',
      asking: s.ask && !s.cleared, count: '14',
      ask: () => { if (!s.cleared) this.setState({ ask: !s.ask }); },
      confirm: () => this.setState({ ask: false, cleared: true }),
      cancel: () => this.setState({ ask: false })
    });
    const sw = (id, label, desc) => ({
      isLink: false, isSwitch: true, isAction: false, label: label, desc: desc,
      on: !!s[id],
      track: s[id] ? t.ink : 'transparent',
      edge: s[id] ? t.ink : t.muted,
      knob: s[id] ? t.bg : t.muted,
      knobX: s[id] ? 21 : 3,
      pick: () => this.setState({ [id]: !s[id] })
    });
    return {
      t: t,
      sections: [
        { title: 'Reading', rows: [link('Font', 'Serif', 'OB3Reading.dc.html'), link('Text size', 'Medium'), link('Theme', 'Light', 'OB3Reading.dc.html'), link('Home view', 'Comfortable', 'OB3Reading.dc.html'), link('Accessibility', 'Colour, vision, reading', 'YouAccessibility.dc.html')] },
        { title: 'Your news', rows: [link('Who you trust', '4 sources', 'OB6Sources.dc.html'), link('Topics', '5', 'OB4Topics.dc.html'), link('Places', '4', 'OB5Regions.dc.html')] },
        { title: 'Language', rows: [link('App language', 'English', 'YouLanguage.dc.html'), link('Source languages', 'English, मराठी', 'YouLanguage.dc.html'), link('Hindi and Marathi font', 'Match Font', 'YouLanguage.dc.html')] },
        { title: 'Notifications', rows: [link('New edition', '6:00 AM · every day', 'YouNotifications.dc.html'), link('Topic and source alerts', 'Off', 'YouNotifications.dc.html')] },
        { title: 'Front page', rows: [sw('trending', 'Trending', 'Five stories the most outlets are covering.'), sw('papers', 'Papers & Reports', 'Research and official documents.'), sw('outside', 'Outside your sources', 'A few stories from outlets you haven’t chosen.'), sw('cont', 'Continue reading', 'Articles you started.')] },
        { title: 'Storage', rows: [sw('autoDl', 'Auto-download saved articles', s.autoDl ? 'New saves download to this phone as you save them.' : 'Off. Saving does not download. Use ⋯ › Download on a story, or a folder’s Download. Already-downloaded stories stay.'), link('Downloaded', s.cleared ? '0 articles · 0 MB' : '14 articles · 18 MB', 'Library.dc.html'), clearRow()] },
        { title: 'About', rows: [link('Replay the tour', '', 'Tour.dc.html'), link('Our principles'), link('Full source list', 'Public'), link('Privacy')] }
      ]
    };
  }
}
</script>
</body>
</html>
