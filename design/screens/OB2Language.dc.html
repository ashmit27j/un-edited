<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Un:edited — Language</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
button{font:inherit}
*{scrollbar-width:none}*::-webkit-scrollbar{display:none}
/* Devanagari: Tiro (serif) by default, Mukta when the reader picks Sans (data-dv="sans") */
[lang="hi"],[lang="hi"] *,[lang="mr"],[lang="mr"] *{letter-spacing:0!important;text-transform:none!important}
[lang="hi"],[lang="hi"] *{font-family:'Tiro Devanagari Hindi','Mukta',serif!important;font-style:normal}
[lang="mr"],[lang="mr"] *{font-family:'Tiro Devanagari Marathi','Mukta',serif!important;font-style:normal}
[data-dv="sans"] [lang="hi"],[data-dv="sans"] [lang="hi"] *,[data-dv="sans"] [lang="mr"],[data-dv="sans"] [lang="mr"] *,[data-dv="sans"][lang="hi"],[data-dv="sans"][lang="mr"]{font-family:'Mukta',sans-serif!important}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 12px 24px 28px 24px; background: {{t.bg}}; color: {{t.ink}}; font-family: 'Baskervville', Baskerville, 'Libre Baskerville', Georgia, serif; display: flex; flex-direction: column;">
  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); align-items: center; height: 44px;">
    <a href="OB1Welcome.dc.html" aria-label="Back" style="width: 44px; height: 44px; margin-left: -12px; display: flex; align-items: center; justify-content: center;"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round;"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <span style="justify-self: center; font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.8px; text-transform: uppercase; color: {{t.muted}};">Step 1 of 6</span>
    <a href="OB8Printing.dc.html" style="justify-self: end; height: 44px; display: flex; align-items: center; font-family: 'Inter', sans-serif; font-size: 14px; color: {{t.muted}}; text-decoration: underline; text-underline-offset: 3px;">Skip</a>
  </div>
  <div style="height: 2px; background: {{t.rule}}; position: relative;"><span style="position: absolute; left: 0; top: 0; bottom: 0; width: 16.6%; background: {{t.accent}};"></span></div>

  <h1 style="margin: 24px 0 0 0; font-weight: 400; font-size: 30px; line-height: 1.15; letter-spacing: -0.4px;">Which languages do you read?</h1>
  <p style="margin: 10px 0 0 0; font-size: 17px; line-height: 1.45; color: {{t.muted}};">Pick one or more. Your sources will come from these languages.</p>

  <div style="margin-top: 26px; display: flex; flex-direction: column; border-top: 1px solid {{t.ink}};">
    <sc-for list="{{langs}}" as="l" hint-placeholder-count="3">
      <button aria-pressed="{{l.on}}" onClick="{{l.pick}}" style="display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 76px; padding: 0; background: none; border: 0; border-bottom: 1px solid {{t.rule}}; color: {{t.ink}}; cursor: pointer; text-align: left;">
        <span style="display: flex; flex-direction: column; gap: 4px;">
          <span lang="{{l.code}}" style="font-family: {{l.font}}; font-size: 26px; line-height: 1.2;">{{l.native}}</span>
          <span style="font-family: 'Inter', sans-serif; font-size: 12.5px; color: {{t.muted}};">{{l.english}}</span>
        </span>
        <span style="width: 24px; height: 24px; box-sizing: border-box; border: 1.5px solid {{l.box}}; background: {{l.fill}}; color: {{t.bg}}; display: flex; align-items: center; justify-content: center;">
          <sc-if value="{{l.on}}" hint-placeholder-val="{{ false }}"><svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round;"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></sc-if>
        </span>
      </button>
    </sc-for>
  </div>
  <p style="margin: 16px 0 0 0; font-family: 'Inter', sans-serif; font-size: 13px; line-height: 1.5; color: {{t.muted}};">Menus will be in <b style="color: {{t.ink}};">{{menuLang}}</b>. Change this any time in You › Language.</p>

  <a href="OB3Reading.dc.html" style="margin-top: auto; height: 52px; background: {{t.ink}}; color: {{t.bg}}; display: flex; align-items: center; justify-content: center; font-family: 'Inter', sans-serif; font-size: 16px; font-weight: 500;">Continue</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { picked: { en: true, hi: false, mr: true } };
  }
  renderVals() {
    const dark = this.props.dark ?? false;
    const t = dark
      ? { bg: '#1E1C19', ink: '#C9C0B0', muted: '#8E8678', rule: '#38332D', accent: '#C8705F' }
      : { bg: '#F1EBE0', ink: '#1C1A17', muted: '#6B645A', rule: '#DDD4C4', accent: '#A8372A' };
    const picked = this.state.picked;
    const list = [
      { code: 'en', native: 'English', english: 'English', font: "'Baskervville', Baskerville, 'Libre Baskerville', Georgia, serif" },
      { code: 'hi', native: 'हिंदी', english: 'Hindi', font: "'Tiro Devanagari Hindi', serif" },
      { code: 'mr', native: 'मराठी', english: 'Marathi', font: "'Tiro Devanagari Marathi', serif" }
    ];
    const langs = list.map((l) => ({
      code: l.code, native: l.native, english: l.english, font: l.font,
      on: !!picked[l.code],
      box: picked[l.code] ? t.ink : t.muted,
      fill: picked[l.code] ? t.ink : 'transparent',
      pick: () => this.setState({ picked: Object.assign({}, picked, { [l.code]: !picked[l.code] }) })
    }));
    const first = list.find((l) => picked[l.code]);
    return { t: t, langs: langs, menuLang: first ? first.english : 'English' };
  }
}
</script>
</body>
</html>
